[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C90", "SIM", "RET", "ARG", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 4
max-branches = 10
max-statements = 30

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests", "."]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
omit = ["*/tests/*", "*/.venv/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
